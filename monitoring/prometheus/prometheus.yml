# Scrape targets are Docker Compose service names from docker-compose.yml (topology, not secrets).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: surgeguard-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: admission-worker
    static_configs:
      - targets: ["worker:9100"]

  - job_name: demo-origin
    static_configs:
      - targets: ["demo-1:8000", "demo-2:8000", "demo-direct:8000"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
