# SurgeGuard edge proxy (Nginx Open Source, unprivileged image).
# Site configuration is rendered at container start:
#   /docker-entrypoint.d/15-render-upstreams.sh  -> conf.d/sg-upstreams.conf (from BACKEND_URLS)
#   envsubst of templates/sg-site.conf.template  -> conf.d/sg-site.conf
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # $uri (not $request_uri) so query strings are never logged. No cookies or auth headers.
    log_format sg_json escape=json
        '{"ts":"$time_iso8601","server":"$server_port","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"rt":$request_time,"urt":"$upstream_response_time","upstream":"$upstream_addr",'
        '"cache":"$upstream_cache_status","rid":"$request_id"}';
    access_log /dev/stdout sg_json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;

    include /etc/nginx/conf.d/sg-upstreams.conf;
    include /etc/nginx/conf.d/sg-site.conf;
}
