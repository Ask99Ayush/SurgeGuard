# Common upstream headers. Included in every proxied location because proxy_set_header is
# not inherited once a location defines its own.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
# Internal trust headers are always overwritten so clients cannot inject them.
proxy_set_header X-SG-Proxy-Secret "";
proxy_set_header X-Origin-Key "";
proxy_set_header X-SG-Visitor "";
proxy_set_header X-Admin-Key "";
