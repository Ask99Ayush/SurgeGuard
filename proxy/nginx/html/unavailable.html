<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="15">
<title>Temporarily unavailable · SurgeGuard</title>
<style>
:root{--background:#08090b;--surface:#101113;--border:#292a2e;--foreground:#f5f5f6;--muted:#96979d;--accent:#ff5c65;--warning:#f2b84b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--background);color:var(--foreground);font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,sans-serif}
.card{max-width:440px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;box-shadow:0 24px 48px -24px rgba(0,0,0,.6)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warning);margin-right:8px;vertical-align:middle}
.eyebrow{color:var(--muted);font-size:13px;letter-spacing:.02em}
h1{font-size:22px;line-height:1.3;margin:12px 0 8px;font-weight:600;letter-spacing:-.01em}
p{color:var(--muted);margin:0 0 20px}
a{display:inline-block;background:var(--foreground);color:var(--background);text-decoration:none;font-weight:600;padding:10px 16px;border-radius:10px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
small{display:block;margin-top:20px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main class="card" role="main">
  <div class="eyebrow"><span class="dot" aria-hidden="true"></span>SurgeGuard</div>
  <h1>We're temporarily unavailable</h1>
  <p>The waiting room can't confirm your place right now, so we're holding all traffic to keep the site safe. Nothing you did caused this. This page retries automatically every 15 seconds.</p>
  <a href="/">Retry now</a>
  <small>Status: admission service unavailable (fail-closed)</small>
</main>
</body>
</html>
